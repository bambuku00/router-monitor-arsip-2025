<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="id">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layanan Internet Terisolir</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 32rem;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.75rem;
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    p { margin: 0.5rem 0; line-height: 1.55; color: #cbd5e1; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: #dc2626;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">ISOLIR</div>
    <h1>Layanan Internet Anda Terisolir</h1>
    <p>Tagihan belum dibayar atau layanan sedang ditangguhkan.</p>
    <p>Silakan hubungi penyedia layanan internet Anda untuk aktivasi kembali.</p>
  </div>
</body>
</html>
